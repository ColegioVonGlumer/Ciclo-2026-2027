<style>
:root{ --azul:#1B3A8C; --azul-oscuro:#0F2260; --amarillo:#F5C518; --linea:#D9DCE3; }
*{ box-sizing:border-box; }
html,body{ margin:0; min-height:100%; }
body{
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  font-family:'DM Sans',sans-serif; color:#20242C;
  background:radial-gradient(circle at 20% 15%, #24479F 0%, var(--azul) 35%, var(--azul-oscuro) 100%);
}
.tarjeta{
  width:100%; max-width:400px; background:#fff; border-radius:20px; padding:36px 30px 28px;
  box-shadow:0 24px 60px rgba(8,18,56,.45); border-top:6px solid var(--amarillo);
  text-align:center; display:none;
}
.tarjeta.visible{ display:block; }
.logo{ width:86px; height:auto; display:block; margin:0 auto 14px; }
h1{ font-family:'Fraunces',serif; font-weight:700; font-size:25pt; line-height:1.1; color:var(--azul-oscuro); margin:0 0 4px; }
.sub{ font-size:10.5pt; color:#5B6272; margin:0 0 24px; }
.campo{ position:relative; margin-bottom:12px; }
input[type=password], input[type=text]{
  width:100%; padding:13px 46px 13px 14px; font:inherit; font-size:12pt; color:#20242C;
  border:1.5px solid var(--linea); border-radius:12px; outline:none; background:#fff;
}
input:focus{ border-color:var(--azul); box-shadow:0 0 0 3px rgba(27,58,140,.15); }
.ver{
  position:absolute; right:6px; top:50%; transform:translateY(-50%); border:0; background:none; cursor:pointer;
  padding:8px; color:#5B6272; font:inherit; font-size:9pt; font-weight:600;
}
.bio{
  width:100%; padding:13px; border-radius:12px; cursor:pointer; font:inherit; font-weight:700; font-size:11.5pt;
  background:#fff; color:var(--azul); border:1.5px solid var(--azul); margin-bottom:16px;
}
.bio:hover{ background:#F1F4FC; }
.bio:disabled{ opacity:.65; cursor:wait; }
.o{ display:flex; align-items:center; gap:10px; font-size:9pt; color:#8A90A0; margin:0 0 14px; }
.o::before, .o::after{ content:""; flex:1; height:1px; background:var(--linea); }
.enlace{ display:inline-block; margin-top:14px; background:none; border:0; font:inherit; font-size:10pt; font-weight:600; color:var(--azul); cursor:pointer; text-decoration:underline; }
.texto{ font-size:10.5pt; line-height:1.5; color:#4A5163; margin:0 0 22px; }
[hidden]{ display:none !important; }
button.entrar{
  width:100%; padding:13px; border:0; border-radius:12px; cursor:pointer; font:inherit; font-weight:700; font-size:12pt;
  background:var(--amarillo); color:var(--azul-oscuro); transition:filter .15s;
}
button.entrar:hover{ filter:brightness(.96); }
button.entrar:disabled{ opacity:.65; cursor:wait; }
.error{ min-height:20px; margin:12px 0 0; font-size:10pt; font-weight:600; color:#9B2226; }
.pie{ margin-top:18px; font-size:9pt; color:#8A90A0; }
.abriendo{ color:#fff; font-size:11pt; letter-spacing:.04em; display:none; }
.abriendo.visible{ display:block; }
</style>
</head>
<body>
<div class="abriendo" id="abriendo">Abriendo…</div>
<form class="tarjeta" id="tarjeta" autocomplete="off">
  <img class="logo" src="logo.png" alt="Escudo Colegio Von Glumer">
  <h1>Colegio Von Glumer</h1>
  <p class="sub">Acceso para el personal</p>
  <div id="bloque-bio" hidden>
    <button type="button" class="bio" id="bio">Entrar con huella o Face ID</button>
    <p class="o">o con contraseña</p>
  </div>
  <div class="campo">
    <input type="password" id="clave" placeholder="Contraseña" autocomplete="current-password">
    <button type="button" class="ver" id="ver" aria-label="Mostrar contraseña">Ver</button>
  </div>
  <button class="entrar" id="entrar" type="submit">Entrar</button>
  <p class="error" id="error" role="alert"></p>
  <div class="pie">Cardel, Veracruz</div>
</form>
<div class="tarjeta" id="enrolar">
  <img class="logo" src="logo.png" alt="Escudo Colegio Von Glumer">
  <h1>Huella o Face ID</h1>
  <p class="texto">Actívala en este dispositivo y la próxima vez entrarás con ella, sin escribir la contraseña.</p>
  <button class="entrar" id="activar" type="button">Activar</button>
  <button class="enlace" id="ahora-no" type="button">Ahora no</button>
</div>

    if (secreto) {
      var iv = aleatorio(12);
      var cif = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, await llaveEnvoltura(secreto), bytes(rawB64));
      rec.modo = 'prf'; rec.iv = aB64(iv); rec.w = aB64(cif);
    } else {
      rec.modo = 'basico'; rec.k = rawB64;
    }
    dispGuardar(rec);
  }
  async function desbloquear(rec) {
    var secreto = await verificar(bytes(rec.id), rec.modo === 'prf');
    if (rec.modo === 'prf') {
      if (!secreto) throw new Error('sin prf');
      var buf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(rec.iv) }, await llaveEnvoltura(secreto), bytes(rec.w));
      return aB64(buf);
    }
    return rec.k;
  }

  /* ---------- pantallas ---------- */
  function ver(id) {
    ['abriendo', 'tarjeta', 'enrolar'].forEach(function (x) { $(x).classList.toggle('visible', x === id); });
  }
  async function iniciar() {
    var rec = dispLeer();
    if (rec && await bioDisponible()) $('bloque-bio').hidden = false;
    else if (rec) dispBorrar();
    ver('tarjeta');
    if ($('bloque-bio').hidden) $('clave').focus();
  }

  if (!window.crypto || !crypto.subtle) {
    ver('tarjeta');
    $('error').textContent = 'Este navegador no puede abrir la página. Prueba con una versión más reciente.';
    return;
  }

  var enSesion = sesionLeer();
  if (enSesion) {
    ver('abriendo');
    llaveDesdeBytes(enSesion).then(descifrar).then(mostrar).catch(function () { sesionBorrar(); iniciar(); });
  } else {
    iniciar();
  }

  $('ver').addEventListener('click', function () {
    var c = $('clave'), oculto = c.type === 'password';
    c.type = oculto ? 'text' : 'password';
    $('ver').textContent = oculto ? 'Ocultar' : 'Ver';
  });

  $('bio').addEventListener('click', async function () {
    var rec = dispLeer();
    if (!rec) { $('bloque-bio').hidden = true; return; }
    $('error').textContent = '';
    $('bio').disabled = true;
    var raw;
    try {
      raw = await desbloquear(rec);
    } catch (e) {
      forzarRegistro = true;
      $('bio').disabled = false;
      $('error').textContent = 'No se pudo verificar. Escribe la contraseña.';
      return;
    }
    try {
      var html = await descifrar(await llaveDesdeBytes(raw));
      sesionGuardar(raw);
      mostrar(html);
    } catch (e) {
      dispBorrar();
      $('bloque-bio').hidden = true;
      $('error').textContent = 'La contraseña cambió. Escríbela de nuevo.';
    }
  });

  $('tarjeta').addEventListener('submit', async function (e) {
    e.preventDefault();
    var clave = $('clave').value;
    if (!clave) return;
    $('entrar').disabled = true; $('entrar').textContent = 'Verificando…'; $('error').textContent = '';
    var html, raw;
    try {
      var llave = await llaveDesdeClave(clave);
      html = await descifrar(llave);
      raw = aB64(await crypto.subtle.exportKey('raw', llave));
    } catch (err) {
      $('error').textContent = 'Contraseña incorrecta';
      $('entrar').disabled = false; $('entrar').textContent = 'Entrar';
      $('clave').select();
      return;
    }
    sesionGuardar(raw);
    if ((!dispLeer() || forzarRegistro) && await bioDisponible()) {
      ver('enrolar');
      $('activar').onclick = async function () {
        $('activar').disabled = true;
        try { await registrar(raw); } catch (e) {}
        mostrar(html);
      };
      $('ahora-no').onclick = function () { mostrar(html); };
    } else {
      mostrar(html);
    }
  });
})();
</script>
</body>
</html>
