<style>
:root{
  color-scheme:light dark;
  --azul:#1B3A8C; --oscuro:#0F2260; --amarillo:#F5C518;
  --fondo:#EEF1F8;
  --fondo-grad:radial-gradient(120% 60% at 0% 0%,#C9D6FA 0%,rgba(201,214,250,0) 60%),radial-gradient(90% 50% at 100% 30%,#FFF0B8 0%,rgba(255,240,184,0) 60%),radial-gradient(110% 60% at 20% 100%,#D3DCF7 0%,rgba(211,220,247,0) 65%),#EEF1F8;
  --vidrio:rgba(255,255,255,.52);
  --vidrio-sombra:inset 0 1px 0 rgba(255,255,255,.95),inset 0 0 0 1px rgba(255,255,255,.55),0 10px 30px rgba(15,34,96,.08);
  --hoja:rgba(255,255,255,.62);
  --hoja-sombra:inset 0 1px 0 rgba(255,255,255,.95),inset 0 0 0 1px rgba(255,255,255,.5),0 24px 60px rgba(15,34,96,.16);
  --relleno:rgba(255,255,255,.55);
  --relleno-sombra:inset 0 1px 0 rgba(255,255,255,.9),inset 0 0 0 1px rgba(255,255,255,.5),0 4px 14px rgba(15,34,96,.08);
  --face-sombra:inset 0 1px 0 #fff,inset 0 0 0 1px rgba(27,58,140,.35);
  --titulo:#0F2260; --acento:#1B3A8C; --texto:#1C1C1E; --suave:#4A5163; --tenue:#8A90A0; --linea:#D9DCE3;
  --oro:#B08A00; --rojo:#9B2226;
}
@media (prefers-color-scheme:dark){
  :root{
    --fondo:#05070F;
    --fondo-grad:radial-gradient(120% 60% at 0% 0%,#1C2C66 0%,rgba(28,44,102,0) 60%),radial-gradient(90% 50% at 100% 30%,#3A300C 0%,rgba(58,48,12,0) 60%),radial-gradient(110% 60% at 20% 100%,#141E44 0%,rgba(20,30,68,0) 65%),#05070F;
    --vidrio:rgba(40,44,62,.52);
    --vidrio-sombra:inset 0 1px 0 rgba(255,255,255,.16),inset 0 0 0 1px rgba(255,255,255,.07),0 10px 30px rgba(0,0,0,.35);
    --hoja:rgba(26,29,42,.72);
    --hoja-sombra:inset 0 1px 0 rgba(255,255,255,.14),inset 0 0 0 1px rgba(255,255,255,.06),0 24px 60px rgba(0,0,0,.5);
    --relleno:rgba(255,255,255,.1);
    --relleno-sombra:inset 0 1px 0 rgba(255,255,255,.16),inset 0 0 0 1px rgba(255,255,255,.07),0 4px 14px rgba(0,0,0,.25);
    --face-sombra:inset 0 1px 0 rgba(255,255,255,.16),inset 0 0 0 1px rgba(157,184,255,.4);
    --titulo:#E8EDFF; --acento:#9DB8FF; --texto:#F2F3F7; --suave:#B4BACB; --tenue:#8C93A6; --linea:rgba(255,255,255,.14);
    --oro:#F5C518; --rojo:#FF6B6B;
  }
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; min-height:100%; }
body{ min-height:100vh; font-family:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif; color:var(--texto); -webkit-font-smoothing:antialiased; background:var(--fondo); }
body::before{ content:""; position:fixed; inset:0; z-index:-1; background:var(--fondo-grad); }
.logo-o{ display:none !important; }
@media (prefers-color-scheme:dark){ .logo-c{ display:none !important; } .logo-o{ display:block !important; } }
body{ display:flex; align-items:center; justify-content:center; padding:calc(48px + env(safe-area-inset-top)) 20px calc(40px + env(safe-area-inset-bottom)); }
.cuerpo{ width:100%; max-width:480px; }
.marca{ display:flex; flex-direction:column; align-items:flex-start; gap:10px; padding:0 4px; }
.marca img{ width:64px; height:auto; display:block; }
.marca .lugar{ margin-top:10px; font-size:10pt; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--oro); }
.marca h1{ font-family:'Fraunces',serif; font-weight:700; font-size:clamp(36px,9vw,46px); line-height:1.04; color:var(--titulo); margin:0; }
.marca p{ margin:0; font-size:12pt; line-height:1.4; color:var(--suave); }
.accesos{ margin-top:32px; display:flex; flex-direction:column; gap:12px; }
.acceso{
  display:flex; align-items:center; gap:14px; padding:18px 16px 18px 18px; border-radius:30px; color:inherit; text-decoration:none;
  background:var(--vidrio); box-shadow:var(--vidrio-sombra);
  -webkit-backdrop-filter:blur(28px) saturate(180%); backdrop-filter:blur(28px) saturate(180%);
  transition:transform .2s cubic-bezier(.32,.72,0,1);
}
.acceso:hover{ transform:translateY(-2px); }
.acceso:active{ transform:scale(.98); }
.acceso .ic{ width:48px; height:48px; border-radius:24px; flex:none; background:linear-gradient(160deg,#2446A5,#0F2260); color:var(--amarillo); display:flex; align-items:center; justify-content:center; box-shadow:inset 0 1px 0 rgba(255,255,255,.3); }
.acceso .ic svg{ width:26px; height:26px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
.acceso .tx{ flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
.acceso h2{ font-family:'Fraunces',serif; font-weight:700; font-size:21px; line-height:1.15; color:var(--titulo); margin:0; }
.acceso p{ margin:0; font-size:11pt; line-height:1.35; color:var(--suave); }
.candado{ width:32px; height:32px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; color:var(--acento); background:var(--relleno); box-shadow:var(--relleno-sombra); }
.candado svg{ width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.pie{ margin-top:30px; padding:0 4px; font-size:9.5pt; color:var(--tenue); letter-spacing:.04em; }
</style>
</head>
