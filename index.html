<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0F2260">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Von Glumer">
<title>Colegio Von Glumer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{ --azul:#1B3A8C; --azul-oscuro:#0F2260; --amarillo:#F5C518; --linea:#D9DCE3; }
*{ box-sizing:border-box; }
html,body{ margin:0; min-height:100%; }
body{
  min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:26px; padding:28px 20px;
  font-family:'DM Sans',sans-serif; color:#20242C;
  background:radial-gradient(circle at 20% 15%, #24479F 0%, var(--azul) 35%, var(--azul-oscuro) 100%);
}
.marca{ text-align:center; color:#fff; }
.marca img{ width:92px; height:auto; display:block; margin:0 auto 14px; }
.marca h1{ font-family:'Fraunces',serif; font-weight:700; font-size:clamp(26pt,6vw,34pt); line-height:1.1; margin:0; }
.marca p{ font-family:'Fraunces',serif; font-style:italic; font-weight:500; font-size:13pt; color:#C9D5F5; margin:8px 0 0; }
.accesos{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; width:100%; max-width:720px; }
.acceso{
  display:flex; flex-direction:column; gap:8px; background:#fff; border-top:6px solid var(--amarillo); border-radius:18px;
  padding:26px 24px 22px; text-decoration:none; color:inherit; box-shadow:0 24px 60px rgba(8,18,56,.45);
  transition:transform .18s, box-shadow .18s;
}
.acceso:hover{ transform:translateY(-4px); box-shadow:0 30px 70px rgba(8,18,56,.55); }
.acceso .et{ font-size:8.5pt; letter-spacing:.12em; text-transform:uppercase; font-weight:700; color:#6B7490; }
.acceso h2{ font-family:'Fraunces',serif; font-weight:700; font-size:21pt; line-height:1.1; color:var(--azul-oscuro); margin:0; }
.acceso p{ margin:0; font-size:10.5pt; line-height:1.5; color:#4A5163; }
.acceso .entrar{ margin-top:auto; padding-top:10px; font-weight:700; font-size:10.5pt; color:var(--azul); }
.acceso:hover .entrar{ text-decoration:underline; }
.pie{ font-size:9pt; color:#AEBCE6; }
@media (max-width:620px){ .accesos{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="marca">
  <img src="logo-amarillo.png" alt="Escudo Colegio Von Glumer">
  <h1>Colegio Von Glumer</h1>
  <p>Elige tu acceso</p>
</div>
<div class="accesos">
  <a class="acceso" href="docentes.html"><span class="et">Acceso</span><h2>Docentes</h2><p>Calendario integrado y documentos del personal.</p><span class="entrar">Entrar →</span></a>
  <a class="acceso" href="direccion.html"><span class="et">Acceso</span><h2>Dirección General</h2><p>Documentos de la Dirección General.</p><span class="entrar">Entrar →</span></a>
</div>
<div class="pie">Cardel, Veracruz</div>
</body>
</html>
