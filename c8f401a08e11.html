<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light dark;
  --oscuro:#0F2260; --amarillo:#F5C518;
  --fondo:#FFFFFF; --relleno:#F4F6FB;
  --titulo:#0F2260; --acento:#1B3A8C; --texto:#1C1C1E; --suave:#4A5163; --tenue:#7C8394;
  --linea:rgba(15,34,96,.13); --rojo:#B4353F;
}
@media (prefers-color-scheme:dark){
  :root{
    --fondo:#000000; --relleno:rgba(255,255,255,.08);
    --titulo:#E8EDFF; --acento:#9DB8FF; --texto:#F2F3F7; --suave:#B4BACB; --tenue:#8C93A6;
    --linea:rgba(255,255,255,.13); --rojo:#FF6B6B;
  }
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; min-height:100%; }
body{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom)); font-family:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif; color:var(--texto); -webkit-font-smoothing:antialiased; background:var(--fondo); }
.logo-o{ display:none !important; }
@media (prefers-color-scheme:dark){ .logo-c{ display:none !important; } .logo-o{ display:block !important; } }
.tarjeta{ width:100%; max-width:380px; display:none; }
.tarjeta.visible{ display:flex; flex-direction:column; align-items:stretch; }
@media (prefers-reduced-motion:no-preference){
  .tarjeta.visible{ animation:sube .35s cubic-bezier(.32,.72,0,1); }
  @keyframes sube{ from{ opacity:0; transform:translateY(12px); } to{ opacity:1; transform:none; } }
}
.logo{ width:56px; height:auto; display:block; margin:0 0 14px; }
h1{ font-family:'Fraunces',serif; font-weight:700; font-size:30px; line-height:1.1; letter-spacing:-.2px; color:var(--titulo); margin:0; }
.sub{ font-size:16px; color:var(--suave); margin:6px 0 24px; }
#bloque-bio{ width:100%; }
.bio{ width:100%; display:flex; align-items:center; justify-content:center; gap:8px; padding:13px; border:0; border-radius:10px; cursor:pointer; font:inherit; font-size:15px; font-weight:600; color:var(--acento); background:none; box-shadow:inset 0 0 0 1px var(--linea); }
.bio:disabled{ opacity:.65; cursor:wait; }
.o{ display:flex; align-items:center; gap:10px; font-size:13px; color:var(--tenue); margin:16px 0 14px; }
.o::before, .o::after{ content:""; flex:1; height:1px; background:var(--linea); }
.campo{ position:relative; width:100%; }
input[type=password], input[type=text]{ width:100%; padding:14px 58px 14px 14px; font:inherit; font-size:16px; color:var(--texto); border:0; border-radius:10px; outline:none; background:var(--relleno); }
input::placeholder{ color:var(--tenue); }
input:focus{ box-shadow:0 0 0 2px var(--acento); }
.ver{ position:absolute; right:6px; top:50%; transform:translateY(-50%); border:0; background:none; cursor:pointer; padding:8px 10px; color:var(--acento); font:inherit; font-size:14px; font-weight:600; }
button.entrar{ width:100%; margin-top:12px; padding:14px; border:0; border-radius:10px; cursor:pointer; font:inherit; font-size:16px; font-weight:700; background:var(--amarillo); color:var(--oscuro); }
button.entrar:active{ filter:brightness(.96); }
button.entrar:disabled{ opacity:.7; cursor:wait; }
button:focus-visible,a:focus-visible{ outline:2px solid var(--acento); outline-offset:2px; }
.error{ min-height:20px; margin:10px 0 0; font-size:14px; font-weight:600; color:var(--rojo); }
.volver{ display:inline-block; margin-top:10px; font-size:15px; font-weight:600; color:var(--acento); text-decoration:none; }
.volver:hover{ text-decoration:underline; }
.pie{ margin-top:14px; font-size:13px; color:var(--tenue); }
.texto{ font-size:16px; line-height:1.5; color:var(--suave); margin:8px 0 22px; }
.enlace{ margin-top:14px; background:none; border:0; font:inherit; font-size:15px; font-weight:600; color:var(--acento); cursor:pointer; text-align:left; padding:0; }
#enrolar .enlace{ display:block; width:100%; }
#nunca{ margin-top:10px; font-size:14px; color:var(--tenue); }
[hidden]{ display:none !important; }
.abriendo{ display:none; color:var(--suave); font-size:15px; }
.abriendo.visible{ display:block; }
</style>
</head>
<body>
<div class="abriendo" id="abriendo">Abriendo…</div>
<form class="tarjeta" id="tarjeta" autocomplete="off">
  <img class="logo logo-c" src="logo.png" alt="Escudo Colegio Von Glumer"><img class="logo logo-o" src="logo-amarillo.png" alt="Escudo Colegio Von Glumer">
  <h1>Colegio Von Glumer</h1>
  <p class="sub">Acceso para la Dirección General</p>
  <div id="bloque-bio" hidden>
    <button type="button" class="bio" id="bio"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M9 9.5v1M15 9.5v1M12 9.5v3.5h-1M9.5 15.5c1.4 1.1 3.6 1.1 5 0"/></svg><span>Entrar con huella o Face ID</span></button>
    <p class="o">o con contraseña</p>
  </div>
  <div class="campo">
    <input type="password" id="clave" placeholder="Contraseña" autocomplete="current-password">
    <button type="button" class="ver" id="ver" aria-label="Mostrar contraseña">Ver</button>
  </div>
  <button class="entrar" id="entrar" type="submit">Entrar</button>
  <p class="error" id="error" role="alert"></p>
  <a class="volver" href="index.html">‹ Elegir otro acceso</a>
  <div class="pie">Cardel, Veracruz</div>
</form>
<div class="tarjeta" id="enrolar">
  <img class="logo logo-c" src="logo.png" alt="Escudo Colegio Von Glumer"><img class="logo logo-o" src="logo-amarillo.png" alt="Escudo Colegio Von Glumer">
  <h1>Huella o Face ID</h1>
  <p class="texto">Actívala en este dispositivo y la próxima vez entrarás con ella, sin escribir la contraseña.</p>
  <button class="entrar" id="activar" type="button">Activar</button>
  <button class="enlace" id="ahora-no" type="button">Ahora no</button>
  <button class="enlace" id="nunca" type="button">No volver a preguntar en este dispositivo</button>
</div>

<script>
(function () {
  var D = JSON.parse(document.getElementById('datos').textContent);
  var $ = function (id) { return document.getElementById(id); };
  var SESION = 'vgk-direccion', DISPOSITIVO = 'vgb-direccion', NUNCA = 'vgn-direccion';
  var SAL_PRF = new TextEncoder().encode('colegio-von-glumer/prf/1');
  var forzarRegistro = false;

  function bytes(b64) {
    var s = atob(b64), a = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i);
    return a;
  }
  function aB64(buf) {
    var a = new Uint8Array(buf), s = '';
    for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]);
    return btoa(s);
  }
  function aleatorio(n) { return crypto.getRandomValues(new Uint8Array(n)); }

  function sesionLeer() { try { return sessionStorage.getItem(SESION); } catch (e) { return null; } }
  function sesionGuardar(v) { try { sessionStorage.setItem(SESION, v); } catch (e) {} }
  function sesionBorrar() { try { sessionStorage.removeItem(SESION); } catch (e) {} }
  function dispLeer() { try { return JSON.parse(localStorage.getItem(DISPOSITIVO) || 'null'); } catch (e) { return null; } }
  function dispGuardar(o) { try { localStorage.setItem(DISPOSITIVO, JSON.stringify(o)); } catch (e) {} }
  function nuncaLeer() { try { return localStorage.getItem(NUNCA) === 'si'; } catch (e) { return false; } }
  function nuncaGuardar() { try { localStorage.setItem(NUNCA, 'si'); } catch (e) {} }
  function dispBorrar() { try { localStorage.removeItem(DISPOSITIVO); } catch (e) {} }
  try { localStorage.removeItem('vgk'); sessionStorage.removeItem('vgk'); localStorage.removeItem('vgb'); } catch (e) {}

  async function descifrar(llave) {
    var buf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(D.i) }, llave, bytes(D.c));
    return new TextDecoder().decode(buf);
  }
  if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js'); } catch (e) {} }
  function mostrar(html) {
    var t = /<title>([^<]*)<\/title>/.exec(html);
    Array.prototype.slice.call(document.head.children).forEach(function (n) { if (!n.matches('link[rel=icon],link[rel=apple-touch-icon],link[rel=manifest],meta[name=theme-color],meta[name=mobile-web-app-capable],meta[name=apple-mobile-web-app-capable],meta[name=apple-mobile-web-app-title]')) n.remove(); }); document.body.innerHTML = ''; document.body.removeAttribute('class'); document.body.removeAttribute('style');
    document.open();
    document.write(html);
    document.close();
    [['manifest', 'manifest.webmanifest'], ['apple-touch-icon', 'apple-touch-icon.png'], ['icon', 'logo.png']].forEach(function (l) {
      if (!document.head.querySelector('link[rel="' + l[0] + '"]')) {
        var e = document.createElement('link'); e.rel = l[0]; e.href = l[1]; document.head.appendChild(e);
      }
    });
    if (t) document.title = t[1];
  }
  async function llaveDesdeClave(clave) {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(clave), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: bytes(D.s), iterations: D.n, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
  }
  function llaveDesdeBytes(b64) {
    return crypto.subtle.importKey('raw', bytes(b64), { name: 'AES-GCM' }, false, ['decrypt']);
  }

  /* ---------- huella o Face ID (WebAuthn) ---------- */
  async function bioDisponible() {
    try {
      return !!(window.PublicKeyCredential && PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable &&
        await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable());
    } catch (e) { return false; }
  }
  async function llaveEnvoltura(secreto) {
    var base = await crypto.subtle.importKey('raw', secreto, 'HKDF', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'HKDF', hash: 'SHA-256', salt: new Uint8Array(32), info: new TextEncoder().encode('vg-envoltura') },
      base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  }
  async function verificar(id, conPrf) {
    var pk = {
      challenge: aleatorio(32),
      allowCredentials: [{ type: 'public-key', id: id, transports: ['internal'] }],
      userVerification: 'required', timeout: 60000
    };
    if (conPrf) pk.extensions = { prf: { eval: { first: SAL_PRF } } };
    var r = await navigator.credentials.get({ publicKey: pk });
    var ext = r.getClientExtensionResults();
    return ext.prf && ext.prf.results ? ext.prf.results.first : null;
  }
  async function registrar(rawB64) {
    var cred = await navigator.credentials.create({ publicKey: {
      rp: { name: 'Colegio Von Glumer', id: location.hostname },
      user: { id: aleatorio(16), name: 'direccion', displayName: 'Dirección General Von Glumer' },
      challenge: aleatorio(32),
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged' },
      attestation: 'none', timeout: 60000,
      extensions: { prf: { eval: { first: SAL_PRF } } }
    } });
    var ext = cred.getClientExtensionResults();
    var prf = ext.prf || {};
    var secreto = prf.results ? prf.results.first : null;
    if (prf.enabled && !secreto) secreto = await verificar(cred.rawId, true);
    var rec = { id: aB64(cred.rawId) };
    if (secreto) {
      var iv = aleatorio(12);
      var cif = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, await llaveEnvoltura(secreto), bytes(rawB64));
      rec.modo = 'prf'; rec.iv = aB64(iv); rec.w = aB64(cif);
    } else {
      rec.modo = 'basico'; rec.k = rawB64;
    }
    dispGuardar(rec);
  }
  async function desbloquear(rec) {
    var secreto = await verificar(bytes(rec.id), rec.modo === 'prf');
    if (rec.modo === 'prf') {
      if (!secreto) throw new Error('sin prf');
      var buf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(rec.iv) }, await llaveEnvoltura(secreto), bytes(rec.w));
      return aB64(buf);
    }
    return rec.k;
  }

  /* ---------- pantallas ---------- */
  function ver(id) {
    ['abriendo', 'tarjeta', 'enrolar'].forEach(function (x) { $(x).classList.toggle('visible', x === id); });
  }
  async function iniciar() {
    var rec = dispLeer();
    if (rec && await bioDisponible()) $('bloque-bio').hidden = false;
    else if (rec) dispBorrar();
    ver('tarjeta');
    if ($('bloque-bio').hidden) $('clave').focus();
  }

  if (!window.crypto || !crypto.subtle) {
    ver('tarjeta');
    $('error').textContent = 'Este navegador no puede abrir la página. Prueba con una versión más reciente.';
    return;
  }

  var enSesion = sesionLeer();
  if (enSesion) {
    ver('abriendo');
    llaveDesdeBytes(enSesion).then(descifrar).then(mostrar).catch(function () { sesionBorrar(); iniciar(); });
  } else {
    iniciar();
  }

  $('ver').addEventListener('click', function () {
    var c = $('clave'), oculto = c.type === 'password';
    c.type = oculto ? 'text' : 'password';
    $('ver').textContent = oculto ? 'Ocultar' : 'Ver';
  });

  $('bio').addEventListener('click', async function () {
    var rec = dispLeer();
    if (!rec) { $('bloque-bio').hidden = true; return; }
    $('error').textContent = '';
    $('bio').disabled = true;
    var raw;
    try {
      raw = await desbloquear(rec);
    } catch (e) {
      forzarRegistro = true;
      $('bio').disabled = false;
      $('error').textContent = 'No se pudo verificar. Escribe la contraseña.';
      return;
    }
    try {
      var html = await descifrar(await llaveDesdeBytes(raw));
      sesionGuardar(raw);
      mostrar(html);
    } catch (e) {
      dispBorrar();
      $('bloque-bio').hidden = true;
      $('error').textContent = 'La contraseña cambió. Escríbela de nuevo.';
    }
  });

  $('tarjeta').addEventListener('submit', async function (e) {
    e.preventDefault();
    var clave = $('clave').value;
    if (!clave) return;
    $('entrar').disabled = true; $('entrar').textContent = 'Verificando…'; $('error').textContent = '';
    var html, raw;
    try {
      var llave = await llaveDesdeClave(clave);
      html = await descifrar(llave);
      raw = aB64(await crypto.subtle.exportKey('raw', llave));
    } catch (err) {
      $('error').textContent = 'Contraseña incorrecta';
      $('entrar').disabled = false; $('entrar').textContent = 'Entrar';
      $('clave').select();
      return;
    }
    sesionGuardar(raw);
    if ((!dispLeer() || forzarRegistro) && !nuncaLeer() && await bioDisponible()) {
      ver('enrolar');
      $('activar').onclick = async function () {
        $('activar').disabled = true;
        try { await registrar(raw); } catch (e) {}
        mostrar(html);
      };
      $('ahora-no').onclick = function () { mostrar(html); };
      $('nunca').onclick = function () { nuncaGuardar(); mostrar(html); };
    } else {
      mostrar(html);
    }
  });
})();
</script>
