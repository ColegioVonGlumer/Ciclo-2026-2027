<style>
:root{
  color-scheme:light dark;
  --azul:#1B3A8C; --oscuro:#0F2260; --amarillo:#F5C518;
  --fondo:#EEF1F8;
  --fondo-grad:radial-gradient(120% 60% at 0% 0%,#C9D6FA 0%,rgba(201,214,250,0) 60%),radial-gradient(90% 50% at 100% 30%,#FFF0B8 0%,rgba(255,240,184,0) 60%),radial-gradient(110% 60% at 20% 100%,#D3DCF7 0%,rgba(211,220,247,0) 65%),#EEF1F8;
  --vidrio:rgba(255,255,255,.52);
  --vidrio-sombra:inset 0 1px 0 rgba(255,255,255,.95),inset 0 0 0 1px rgba(255,255,255,.55),0 10px 30px rgba(15,34,96,.08);
  --hoja:rgba(255,255,255,.62);
  --hoja-sombra:inset 0 1px 0 rgba(255,255,255,.95),inset 0 0 0 1px rgba(255,255,255,.5),0 24px 60px rgba(15,34,96,.16);
  --relleno:rgba(255,255,255,.55);
  --relleno-sombra:inset 0 1px 0 rgba(255,255,255,.9),inset 0 0 0 1px rgba(255,255,255,.5),0 4px 14px rgba(15,34,96,.08);
  --face-sombra:inset 0 1px 0 #fff,inset 0 0 0 1px rgba(27,58,140,.35);
  --titulo:#0F2260; --acento:#1B3A8C; --texto:#1C1C1E; --suave:#4A5163; --tenue:#8A90A0; --linea:#D9DCE3;
  --oro:#B08A00; --rojo:#9B2226;
}
@media (prefers-color-scheme:dark){
  :root{
    --fondo:#05070F;
    --fondo-grad:radial-gradient(120% 60% at 0% 0%,#1C2C66 0%,rgba(28,44,102,0) 60%),radial-gradient(90% 50% at 100% 30%,#3A300C 0%,rgba(58,48,12,0) 60%),radial-gradient(110% 60% at 20% 100%,#141E44 0%,rgba(20,30,68,0) 65%),#05070F;
    --vidrio:rgba(40,44,62,.52);
    --vidrio-sombra:inset 0 1px 0 rgba(255,255,255,.16),inset 0 0 0 1px rgba(255,255,255,.07),0 10px 30px rgba(0,0,0,.35);
    --hoja:rgba(26,29,42,.72);
    --hoja-sombra:inset 0 1px 0 rgba(255,255,255,.14),inset 0 0 0 1px rgba(255,255,255,.06),0 24px 60px rgba(0,0,0,.5);
    --relleno:rgba(255,255,255,.1);
    --relleno-sombra:inset 0 1px 0 rgba(255,255,255,.16),inset 0 0 0 1px rgba(255,255,255,.07),0 4px 14px rgba(0,0,0,.25);
    --face-sombra:inset 0 1px 0 rgba(255,255,255,.16),inset 0 0 0 1px rgba(157,184,255,.4);
    --titulo:#E8EDFF; --acento:#9DB8FF; --texto:#F2F3F7; --suave:#B4BACB; --tenue:#8C93A6; --linea:rgba(255,255,255,.14);
    --oro:#F5C518; --rojo:#FF6B6B;
  }
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; min-height:100%; }
body{ min-height:100vh; font-family:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif; color:var(--texto); -webkit-font-smoothing:antialiased; background:var(--fondo); }
body::before{ content:""; position:fixed; inset:0; z-index:-1; background:var(--fondo-grad); }
.logo-o{ display:none !important; }
@media (prefers-color-scheme:dark){ .logo-c{ display:none !important; } .logo-o{ display:block !important; } }
body{ display:flex; align-items:center; justify-content:center; padding:calc(24px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom)); }
.tarjeta{
  width:100%; max-width:420px; border-radius:38px; padding:34px 26px 24px; text-align:center; display:none;
  background:var(--hoja); box-shadow:var(--hoja-sombra);
  -webkit-backdrop-filter:blur(36px) saturate(180%); backdrop-filter:blur(36px) saturate(180%);
}
.tarjeta.visible{ display:flex; flex-direction:column; align-items:center; animation:sube .45s cubic-bezier(.32,.72,0,1); }
@keyframes sube{ from{ opacity:0; transform:translateY(18px) scale(.98); } to{ opacity:1; transform:none; } }
.logo{ width:58px; height:auto; display:block; margin:0 auto 12px; }
h1{ font-family:'Fraunces',serif; font-weight:700; font-size:27px; line-height:1.1; color:var(--titulo); margin:0; }
.sub{ font-size:11.5pt; color:var(--suave); margin:5px 0 24px; }
#bloque-bio{ width:100%; }
.bio{
  width:100%; display:flex; align-items:center; justify-content:center; gap:8px; padding:15px; border:0; border-radius:999px; cursor:pointer;
  font:inherit; font-size:12pt; font-weight:700; color:var(--acento); background:var(--relleno); box-shadow:var(--face-sombra);
}
.bio:disabled{ opacity:.65; cursor:wait; }
.o{ display:flex; align-items:center; gap:10px; font-size:10pt; color:var(--tenue); margin:16px 0 14px; }
.o::before, .o::after{ content:""; flex:1; height:1px; background:var(--linea); }
.campo{ position:relative; width:100%; }
input[type=password], input[type=text]{
  width:100%; padding:15px 58px 15px 18px; font:inherit; font-size:13pt; color:var(--texto); border:0; border-radius:16px; outline:none;
  background:var(--relleno); box-shadow:var(--relleno-sombra);
}
input::placeholder{ color:var(--tenue); }
input:focus{ box-shadow:var(--relleno-sombra),0 0 0 3px rgba(27,58,140,.28); }
.ver{ position:absolute; right:8px; top:50%; transform:translateY(-50%); border:0; background:none; cursor:pointer; padding:8px 10px; color:var(--acento); font:inherit; font-size:10pt; font-weight:700; }
button.entrar{
  width:100%; margin-top:12px; padding:16px; border:0; border-radius:999px; cursor:pointer; font:inherit; font-size:13pt; font-weight:700;
  background:var(--amarillo); color:var(--oscuro); box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 6px 18px rgba(245,197,24,.35);
  transition:transform .1s, filter .15s;
}
button.entrar:hover{ filter:brightness(1.04); }
button.entrar:active{ transform:scale(.98); }
button.entrar:disabled{ opacity:.7; cursor:wait; }
.error{ min-height:20px; margin:10px 0 0; font-size:10.5pt; font-weight:600; color:var(--rojo); }
.volver{ display:inline-block; margin-top:10px; font-size:11pt; font-weight:600; color:var(--acento); text-decoration:none; }
.volver:hover{ text-decoration:underline; }
.pie{ margin-top:10px; font-size:9.5pt; color:var(--tenue); }
.texto{ font-size:11.5pt; line-height:1.5; color:var(--suave); margin:8px 0 22px; }
.enlace{ margin-top:14px; background:none; border:0; font:inherit; font-size:11pt; font-weight:600; color:var(--acento); cursor:pointer; }
[hidden]{ display:none !important; }
.abriendo{ display:none; color:var(--suave); font-size:11.5pt; letter-spacing:.04em; }
.abriendo.visible{ display:block; }
</style>
</head>
<body>
<div class="abriendo" id="abriendo">Abriendo…</div>
<form class="tarjeta" id="tarjeta" autocomplete="off">
  <img class="logo logo-c" src="logo.png" alt="Escudo Colegio Von Glumer"><img class="logo logo-o" src="logo-amarillo.png" alt="Escudo Colegio Von Glumer">
  <h1>Colegio Von Glumer</h1>
  <p class="sub">Acceso para la Dirección General</p>
  <div id="bloque-bio" hidden>
    <button type="button" class="bio" id="bio"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M9 9.5v1M15 9.5v1M12 9.5v3.5h-1M9.5 15.5c1.4 1.1 3.6 1.1 5 0"/></svg><span>Entrar con huella o Face ID</span></button>
    <p class="o">o con contraseña</p>
  </div>
  <div class="campo">
    <input type="password" id="clave" placeholder="Contraseña" autocomplete="current-password">
    <button type="button" class="ver" id="ver" aria-label="Mostrar contraseña">Ver</button>
  </div>
  <button class="entrar" id="entrar" type="submit">Entrar</button>
  <p class="error" id="error" role="alert"></p>
  <a class="volver" href="index.html">‹ Elegir otro acceso</a>
  <div class="pie">Cardel, Veracruz</div>
</form>
<div class="tarjeta" id="enrolar">
  <img class="logo logo-c" src="logo.png" alt="Escudo Colegio Von Glumer"><img class="logo logo-o" src="logo-amarillo.png" alt="Escudo Colegio Von Glumer">
  <h1>Huella o Face ID</h1>
  <p class="texto">Actívala en este dispositivo y la próxima vez entrarás con ella, sin escribir la contraseña.</p>
  <button class="entrar" id="activar" type="button">Activar</button>
  <button class="enlace" id="ahora-no" type="button">Ahora no</button>
</div>

<script>
(function () {
  var D = JSON.parse(document.getElementById('datos').textContent);
  var $ = function (id) { return document.getElementById(id); };
  var SESION = 'vgk-direccion', DISPOSITIVO = 'vgb-direccion';
  var SAL_PRF = new TextEncoder().encode('colegio-von-glumer/prf/1');
  var forzarRegistro = false;

  function bytes(b64) {
    var s = atob(b64), a = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i);

    var cred = await navigator.credentials.create({ publicKey: {
      rp: { name: 'Colegio Von Glumer', id: location.hostname },
      user: { id: aleatorio(16), name: 'direccion', displayName: 'Dirección General Von Glumer' },
      challenge: aleatorio(32),
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged' },
      attestation: 'none', timeout: 60000,
      extensions: { prf: { eval: { first: SAL_PRF } } }
    } });
    var ext = cred.getClientExtensionResults();
    var prf = ext.prf || {};
    var secreto = prf.results ? prf.results.first : null;
    if (prf.enabled && !secreto) secreto = await verificar(cred.rawId, true);
    var rec = { id: aB64(cred.rawId) };
    if (secreto) {
      var iv = aleatorio(12);
      var cif = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, await llaveEnvoltura(secreto), bytes(rawB64));
      rec.modo = 'prf'; rec.iv = aB64(iv); rec.w = aB64(cif);
    } else {
      rec.modo = 'basico'; rec.k = rawB64;
    }
    dispGuardar(rec);
  }
  async function desbloquear(rec) {
    var secreto = await verificar(bytes(rec.id), rec.modo === 'prf');
    if (rec.modo === 'prf') {
      if (!secreto) throw new Error('sin prf');
      var buf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(rec.iv) }, await llaveEnvoltura(secreto), bytes(rec.w));
      return aB64(buf);
    }
    return rec.k;
  }

  /* ---------- pantallas ---------- */
  function ver(id) {
    ['abriendo', 'tarjeta', 'enrolar'].forEach(function (x) { $(x).classList.toggle('visible', x === id); });
  }
  async function iniciar() {
    var rec = dispLeer();
    if (rec && await bioDisponible()) $('bloque-bio').hidden = false;
    else if (rec) dispBorrar();
    ver('tarjeta');
    if ($('bloque-bio').hidden) $('clave').focus();
  }

  if (!window.crypto || !crypto.subtle) {
    ver('tarjeta');
    $('error').textContent = 'Este navegador no puede abrir la página. Prueba con una versión más reciente.';
    return;
  }

  var enSesion = sesionLeer();
  if (enSesion) {
    ver('abriendo');
    llaveDesdeBytes(enSesion).then(descifrar).then(mostrar).catch(function () { sesionBorrar(); iniciar(); });
  } else {
    iniciar();
  }

  $('ver').addEventListener('click', function () {
    var c = $('clave'), oculto = c.type === 'password';
    c.type = oculto ? 'text' : 'password';
    $('ver').textContent = oculto ? 'Ocultar' : 'Ver';
  });

  $('bio').addEventListener('click', async function () {
    var rec = dispLeer();
    if (!rec) { $('bloque-bio').hidden = true; return; }
    $('error').textContent = '';
    $('bio').disabled = true;
    var raw;
    try {
      raw = await desbloquear(rec);
    } catch (e) {
      forzarRegistro = true;
      $('bio').disabled = false;
      $('error').textContent = 'No se pudo verificar. Escribe la contraseña.';
      return;
    }
    try {
      var html = await descifrar(await llaveDesdeBytes(raw));
      sesionGuardar(raw);
      mostrar(html);
    } catch (e) {
      dispBorrar();
      $('bloque-bio').hidden = true;
      $('error').textContent = 'La contraseña cambió. Escríbela de nuevo.';
    }
  });

  $('tarjeta').addEventListener('submit', async function (e) {
    e.preventDefault();
    var clave = $('clave').value;
    if (!clave) return;
    $('entrar').disabled = true; $('entrar').textContent = 'Verificando…'; $('error').textContent = '';
    var html, raw;
    try {
      var llave = await llaveDesdeClave(clave);
      html = await descifrar(llave);
      raw = aB64(await crypto.subtle.exportKey('raw', llave));
    } catch (err) {
      $('error').textContent = 'Contraseña incorrecta';
      $('entrar').disabled = false; $('entrar').textContent = 'Entrar';
      $('clave').select();
      return;
    }
    sesionGuardar(raw);
    if ((!dispLeer() || forzarRegistro) && await bioDisponible()) {
      ver('enrolar');
      $('activar').onclick = async function () {
        $('activar').disabled = true;
        try { await registrar(raw); } catch (e) {}
        mostrar(html);
      };
      $('ahora-no').onclick = function () { mostrar(html); };
    } else {
      mostrar(html);
    }
  });
})();
</script>
